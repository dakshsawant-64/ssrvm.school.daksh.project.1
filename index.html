<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopConnect</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header -->
    <header>
        <h1>ShopConnect</h1>
        <p>Find products from nearby shops.</p>
    </header>

    <!-- Navigation -->
    <nav>
        <a href="#">Home</a>
        <a href="#">Browse Shops</a>
        <a href="#">Search</a>
        <a href="#">Login</a>
        <a href="#">Register Shop</a>
    </nav>

    <!-- Hero Section -->
    <section class="hero">
        <h2>Search Products From Local Shops</h2>
        <p>Find products, compare prices, and contact shop owners.</p>

        <div class="search-box">
            <input type="text" placeholder="Search for a product...">
            <button>Search</button>
        </div>
    </section>

    <!-- Dynamic Products -->
    <main>

        <section class="products" id="products">

            <!--
                Product cards will be created here later
                using JavaScript or React.
            -->

        </section>

    </main>

    <!-- Footer -->
    <footer>
        <p>© 2026 ShopConnect</p>
    </footer>

</body>
</html>
